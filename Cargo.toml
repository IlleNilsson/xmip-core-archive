[package]
name = "xmip-core-archive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-archive"
description = "Archival contracts for retained Xmip data, and what every archive technology shares: the item, the receipt, the metadata text, the timestamp, the layout, the file created whole, the directory a receipt names and the checksum."

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
# The estate's encoding primitives: the civil calendar a receipt's time is
# written from, and the one checksum a receipt carries, SHA-256 in hex,
# here rather than in each technology (ADR-0044).
codec = { workspace = true }
# SQL: the dialect a SQL technology names, which writes the row's INSERT
# and SELECT and reads its bytes back (`sql.rs`).
sql = { workspace = true }
# The one clock (`xcore::Clock`), which an item's archived time is read
# from; a technology takes the moment as a parameter.
xcore = { workspace = true }
# The file held by its process while it is written, removed only where no
# process holds it, and the directory synced after it is linked to its
# name (`whole.rs`), written once for the estate.
file = { workspace = true }
# A filesystem path as the path of a URI, written once for the estate: the
# `file://` receipt of an archive on a file system (`directory.rs`).
net = { workspace = true }

[features]
# The item and the timeout a technology's tests archive with, from the
# capability's `fixture` module. A technology enables it from its
# dev-dependencies only, so the fixtures are never in a production build.
test-support = []

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
# It waits for a sweep through `whole::swept`, under `test-support`.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false
required-features = ["test-support"]

[dev-dependencies]
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
